name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # BUG-073 / ITI-066: actions pinned to specific minor versions. SHA
      # pinning is the final hardening step before release — it requires a human
      # to resolve the commit SHAs via, e.g.:
      #   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
      # Dependabot (.github/dependabot.yml) opens weekly PRs that surface the
      # resolved SHAs for each new release so this stays tractable.
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.3.0
        with:
          node-version: 24.18.0
          cache: npm
      # BUG-029: verify npm version matches the engine requirement.
      - name: Verify npm version
        run: |
          NPM_VERSION=$(npm --version)
          if [[ ! "$NPM_VERSION" =~ ^11\. ]]; then
            echo "ERROR: npm $NPM_VERSION does not satisfy >=11 <12"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # MEDIUM-06: CI runs one full verify, then package-artifacts only.
      # Previously `npm run package` expanded to `release:check` which
      # re-ran npm ci + playwright install + verify — duplicating ~15 minutes
      # of work. The CI already installed deps and browsers, so call the
      # artifact builder directly after a single verify pass.
      - run: npm run verify
      - run: npm run package-artifacts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 14
