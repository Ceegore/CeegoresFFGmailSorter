name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # BUG-073 / ITI-066: actions pinned to specific minor versions. SHA
      # pinning is the final hardening step before release — it requires a human
      # to resolve the commit SHAs via, e.g.:
      #   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
      # Dependabot (.github/dependabot.yml) opens weekly PRs that surface the
      # resolved SHAs for each new release so this stays tractable.
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      # BUG-029: verify npm version matches the engine requirement.
      - name: Verify npm version
        run: |
          NPM_VERSION=$(npm --version)
          if [[ ! "$NPM_VERSION" =~ ^11\. ]]; then
            echo "ERROR: npm $NPM_VERSION does not satisfy >=11 <12"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # BUG-060: spec hash is the first gate — before any build or test.
      - run: npm run verify:spec-hash
      - run: npm run verify
      # ITI-064: run the packaging step in CI so a broken release pipeline is
      # caught before tagging. package.mjs rebuilds dist and web-ext builds the
      # xpi, so this also exercises the full artifact path.
      - run: npm run package
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: verification-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            dist/
          if-no-files-found: ignore
          retention-days: 14
